services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Official local Bot API server — raises the bot upload limit from 50MB to
  # 2GB, needed for lesson video uploads (idea-platforma-kursy.md §9).
  # TELEGRAM_API_ID / TELEGRAM_API_HASH come from the root .env (gitignored).
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    ports:
      - "8082:8081"
    volumes:
      - bot_api_data:/var/lib/telegram-bot-api

volumes:
  postgres_data:
  bot_api_data:
